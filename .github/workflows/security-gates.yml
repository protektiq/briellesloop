name: security-gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  abuse-tests-and-socket-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend abuse tests
        run: npm run test --workspace backend -- --runInBand

      - name: Verify Socket report presence
        run: |
          if [ ! -f socket-report.json ]; then
            echo "Expected socket-report.json in workspace before policy step."
            echo "Generate it in an earlier CI step using your Socket scanner."
            exit 1
          fi

      - name: Enforce Socket reachable runtime policy
        run: node scripts/check-socket-reachable-runtime.mjs
